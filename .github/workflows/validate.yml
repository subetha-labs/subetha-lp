name: Validate LP

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-check:
    name: Static HTML check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # PR base SHAs must be available to the offline preservation/scope guards.
          fetch-depth: 0

      - name: Validate HTML and language switch markers
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          assert text.startswith("<!doctype html>"), "missing doctype"
          assert "<html lang=\"en\">" in text, "English must be the default language"
          assert 'data-lang="en"' in text, "missing EN switch"
          assert 'data-lang="ja"' in text, "missing JA switch"
          assert "aria-pressed" in text, "language switch must expose aria-pressed"
          assert "prefers-reduced-motion" in text, "reduced-motion rule is required"
          assert "mailto:" not in text, "contact email must not launch a mail client"
          assert 'data-copy="contact@subethalabs.com"' in text, "copy contact affordance is required"
          # v2 markers encode the honest claims: standard exact wire, EIP-3009, delivery on the mined receipt,
          # zUSDC on testnet, a public transfer, an unquantified link property and remaining correlation.
          for marker in ("exact", "EIP-3009", "mined receipt", "zUSDC", "testnet", "public",
                         "independently quantified", "correlation"):
            assert marker in text, f"missing v2 claim marker: {marker}"
          HTMLParser().feed(text)
          print(f"HTML_PARSE_OK bytes={path.stat().st_size}")
          PY
          python3 -B scripts/check-private-source-links.py

      - name: Validate served-output guard fixtures and the whole public repository (offline)
        run: |
          python3 -B scripts/check-private-source-links.py --fixtures
          python3 -B scripts/check-private-source-links.py --repo

      - name: Validate assertion-level claims guard (offline)
        run: |
          python3 -B scripts/check-claims.py --fixtures
          python3 -B scripts/check-claims.py

      - name: Validate Router wallet-free onboarding (offline)
        run: python3 scripts/check-router.py

      - name: Validate mobile layout contract (offline)
        run: python3 scripts/check-mobile-layout.py

      - name: Validate mobile scope regression fixtures (offline)
        run: python3 -B scripts/check-mobile-scope.py

      - name: Validate bounded mobile PR changes (offline)
        if: github.event_name == 'pull_request'
        env:
          MOBILE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$MOBILE_BASE" -- assets/mobile.css assets/mobile-nav.js scripts/check-mobile-layout.py scripts/check-mobile-scope.py; then
            echo "No mobile-specific changes; mobile task scope does not apply"
          else
            python3 -B scripts/check-router.py --scope mobile --base "$MOBILE_BASE"
          fi

      - name: Check for accidental credentials
        run: |
          if grep -RInE '(CLOUDFLARE_API_TOKEN|CF_API_TOKEN|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' . \
            --exclude-dir=.git --exclude='*.md' --exclude='*.yml' --exclude='*.yaml'; then
            echo "Potential credential material found"
            exit 1
          fi
          echo "CREDENTIAL_SCAN_OK"
